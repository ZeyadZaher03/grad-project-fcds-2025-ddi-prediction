services:
  inference:
    build:
      context: ./inference-py
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MODELS_DIR=/models
      - DEVICE=cpu
    volumes:
      - ./inference-py/app/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - INFERENCE_URL=http://inference:8001
    depends_on:
      inference:
        condition: service_healthy