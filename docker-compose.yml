version: "3.3"

services:
  inference:
    build:
      context: ./inference-py
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/models/ddi_pairmlp_scaffold_smiles_only.pt
      - DEVICE=cpu
    volumes:
      - ./inference-py/app/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # removed start_period (not supported in 3.3)

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - INFERENCE_URL=http://inference:8001
      - APP_API_KEY=MySecureKey2025  # Use this for your security check
    depends_on:
      - inference # simplified (condition not supported in 3.3)